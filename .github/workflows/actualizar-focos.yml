name: Actualizar focos de calor (NASA FIRMS)

on:
  schedule:
    - cron: '7 * * * *'   # cada hora (minuto 7 para evitar picos de carga de GitHub)
  workflow_dispatch: {}    # permite ejecución manual desde la pestaña Actions

# Principio de mínimo privilegio: solo escribir contenido del repo
permissions:
  contents: write

concurrency:
  group: actualizar-focos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Consultar FIRMS y generar focos.json
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/update-focos.mjs

      - name: Publicar cambios
        run: |
          git config user.name "vigia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/focos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática de focos $(date -u +'%Y-%m-%dT%H:%MZ')"
            # reintento con rebase por si el workflow GOES empujó a la vez
            for i in 1 2 3; do
              git push && break
              git pull --rebase && sleep 3
            done
          fi
